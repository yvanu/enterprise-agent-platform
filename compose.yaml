services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-agent}
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_POSTGRES_USER:-agent} -d ${PLATFORM_POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://${PLATFORM_POSTGRES_USER:-agent}:${PLATFORM_POSTGRES_PASSWORD:-agent}@postgres:5432/${PLATFORM_POSTGRES_DB:-agent_platform}
    volumes:
      - agent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  agent-data:
  platform-postgres:
