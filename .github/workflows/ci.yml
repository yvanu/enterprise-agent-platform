name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q app tests scripts
      - run: python -m pytest -q
      - run: pip check
      - run: pip install pip-audit && pip-audit --skip-editable
