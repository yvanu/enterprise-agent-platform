[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise-grade data analysis agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=25,<30",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
