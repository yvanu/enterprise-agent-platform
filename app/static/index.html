<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enterprise Data Agent</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
    h1{margin:0;font-size:28px}p{color:#667085}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;margin-top:24px}
    .card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 1px 2px #1018280d}
    textarea{width:100%;min-height:110px;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font:inherit;resize:vertical}
    button{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;background:#1570ef;color:#fff}
    button.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}.actions{display:flex;gap:10px;margin-top:12px}
    pre{background:#101828;color:#e4e7ec;border-radius:10px;padding:14px;overflow:auto;white-space:pre-wrap;min-height:120px}
    table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eaecf0}th{color:#475467}
    .muted{font-size:13px;color:#98a2b3}.status{display:inline-block;padding:3px 8px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div>
    <span class="status" id="health">checking</span>
    <h1>企业智能数据分析 Agent</h1>
    <p>自然语言 → Schema 感知 → 安全 SQL → 自动纠错 → 分析结论</p>
  </div>

  <div class="grid">
    <section class="card">
      <h3>自然语言分析</h3>
      <textarea id="question">统计每类数据的数量，并指出数量最多的类别。</textarea>
      <div class="actions"><button id="ask">开始分析</button></div>
      <p class="muted">需要在 .env 中配置 LLM_API_KEY 和 LLM_MODEL。</p>
      <h4>结果</h4>
      <pre id="answer">等待执行...</pre>
    </section>

    <section class="card">
      <h3>数据库 Schema</h3>
      <div id="schema">加载中...</div>
    </section>

    <section class="card">
      <h3>安全 SQL 调试</h3>
      <textarea id="sql">SELECT main_type, COUNT(*) AS total
FROM data_assets
GROUP BY main_type
ORDER BY total DESC</textarea>
      <div class="actions"><button class="secondary" id="runSql">执行只读 SQL</button></div>
    </section>

    <section class="card">
      <h3>查询结果</h3>
      <div id="table">等待执行...</div>
    </section>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function json(url,options){
  const r=await fetch(url,options), data=await r.json();
  if(!r.ok) throw new Error(data.detail||JSON.stringify(data));
  return data;
}
function renderTable(data){
  if(!data.rows.length){$("table").textContent="无数据";return}
  const head=data.columns.map(x=>`<th>${x}</th>`).join("");
  const rows=data.rows.map(r=>`<tr>${data.columns.map(c=>`<td>${r[c]??""}</td>`).join("")}</tr>`).join("");
  $("table").innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table><p class="muted">${data.row_count} 行${data.truncated?"（已截断）":""}</p>`;
}
async function load(){
  try{$("health").textContent=(await json("/health")).status}catch{$("health").textContent="offline"}
  try{
    const s=await json("/api/v1/data/schema");
    $("schema").innerHTML=s.tables.map(t=>`<p><b>${t.name}</b><br><span class="muted">${t.columns.map(c=>c.name+" : "+c.type).join("<br>")}</span></p>`).join("");
  }catch(e){$("schema").textContent=e.message}
}
$("runSql").onclick=async()=>{
  $("table").textContent="执行中...";
  try{renderTable(await json("/api/v1/data/sql",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sql:$("sql").value})}))}
  catch(e){$("table").textContent=e.message}
};
$("ask").onclick=async()=>{
  $("answer").textContent="Agent 分析中...";
  try{
    const d=await json("/api/v1/data/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:$("question").value})});
    $("answer").textContent=d.answer+"\n\n"+d.insights.map(x=>"• "+x).join("\n")+"\n\nSQL:\n"+d.sql+"\n\nAttempts: "+d.attempts.length;
    renderTable(d.result);
  }catch(e){$("answer").textContent=e.message}
};
load();
</script>
</body>
</html>
